name: Sync media capabilities and deploy to GitHub Pages

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allow manual trigger
  push:
    branches:
      - feat/media-studio-fields
    paths:
      - "src/media-capabilities/**"
      - "docs/**"

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Aggregate media capabilities
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          npx tsx src/media-capabilities/aggregator.ts

      - name: Copy data to docs
        run: cp data/media-capabilities.json docs/media-capabilities.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/media-capabilities.json data/media-capabilities.json
          git diff --staged --quiet || git commit -m "chore: sync media capabilities [skip ci]"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4