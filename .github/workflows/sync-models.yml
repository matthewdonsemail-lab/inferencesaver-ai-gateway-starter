name: Refresh account model catalog

on:
  workflow_dispatch:
  schedule:
    # 5x per day: 01:00, 06:00, 11:00, 16:00, 21:00 UTC
    - cron: "0 1,6,11,16,21 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh normalized catalog
        run: npm run sync-models
        env:
          INFERENCESAVER_API_KEY: ${{ secrets.INFERENCESAVER_API_KEY }}
      - name: Verify generated scope
        run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/refresh-model-catalog
          delete-branch: true
          commit-message: "chore: refresh account model catalog"
          title: "chore: refresh account model catalog"
          body: "Automated refresh: authenticated /v1/models (account availability + supported_endpoint_types) merged with the public pricing catalog (per-M pricing, context window, savings). Raw responses and credentials are not persisted."
          add-paths: data/models.json
