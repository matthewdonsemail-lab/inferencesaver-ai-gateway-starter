name: Credentialed smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      INFERENCESAVER_API_KEY: ${{ secrets.INFERENCESAVER_API_KEY }}
      INFERENCESAVER_OPENAI_MODEL: ${{ vars.INFERENCESAVER_OPENAI_MODEL }}
      INFERENCESAVER_ANTHROPIC_MODEL: ${{ vars.INFERENCESAVER_ANTHROPIC_MODEL }}
      INFERENCESAVER_AI_SDK_MODEL: ${{ vars.INFERENCESAVER_AI_SDK_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-models
      - run: npm run example:openai
      - run: npm run example:anthropic
      - run: npm run example:ai-sdk
